<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMBLOX - Game Web</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- Topbar Ala Roblox -->
    <div id="roblox-topbar">
        <div class="topbar-left">
            <button class="icon-btn logo-btn">H</button>
            <button class="icon-btn">💬</button>
        </div>
        <div class="topbar-right">
            <span class="player-name">Player1</span>
        </div>
    </div>

    <!-- Leaderboard (Tab Menu) -->
    <div id="leaderboard">
        <div class="leaderboard-header">Players</div>
        <div class="player-row active">
            <span class="p-name">Player1</span>
            <span class="p-score">0</span>
        </div>
    </div>

    <!-- Canvas Game -->
    <script src="game.js"></script>
</body>
</html>
